name: Тесты
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Проверка синтаксиса
        run: for f in *.js js/*.js; do node --check "$f" || exit 1; done
      - name: Версии подключений (?v=)
        run: node tools/bump-versions.js --check
      - name: Юнит-тесты (tests.js)
        run: npm run test:unit
      - name: Сценарии стенда (игрок + мастер)
        run: npm run test:e2e
        env:
          PAR: 3
      - name: Логи стенда
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: tests/e2e/out/
